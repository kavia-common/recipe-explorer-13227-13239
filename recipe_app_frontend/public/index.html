<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4CAF50" />
    <meta name="description" content="Discover, save, and organize your favorite recipes with Recipe Explorer. Browse through a collection of delicious recipes, create personal collections, and view detailed nutritional information." />
    <meta name="keywords" content="recipes, cooking, food, nutrition, meal planning, ingredients" />
    <meta name="author" content="Recipe Explorer" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%PUBLIC_URL%" />
    <meta property="og:title" content="Recipe Explorer - Discover & Save Recipes" />
    <meta property="og:description" content="Discover, save, and organize your favorite recipes with Recipe Explorer." />
    <meta property="og:image" content="%PUBLIC_URL%/recipe-hero.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="%PUBLIC_URL%" />
    <meta property="twitter:title" content="Recipe Explorer - Discover & Save Recipes" />
    <meta property="twitter:description" content="Discover, save, and organize your favorite recipes with Recipe Explorer." />
    <meta property="twitter:image" content="%PUBLIC_URL%/recipe-hero.jpg" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://via.placeholder.com">
    
    <title>Recipe Explorer - Discover & Save Recipes</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <script>
      // Register service worker for offline functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('%PUBLIC_URL%/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
